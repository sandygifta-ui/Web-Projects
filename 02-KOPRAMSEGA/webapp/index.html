<!-- HALAMAN LOGIN -->
<div id="page-login" class="page active">
  <div class="login-wrapper">

    <!-- LOGO AMBALAN -->
    <div class="login-header">
      <div class="ambalan-logo">
        <div class="ambalan-half ambalan-left">
          <span class="ambalan-label">SAMBERNYAWA</span>
        </div>
        <div class="ambalan-center">
          <span class="fleur">⚜</span>
        </div>
        <div class="ambalan-half ambalan-right">
          <span class="ambalan-label">DEWI SARTIKA</span>
        </div>
      </div>
      <h1 class="login-title">KOPRAMSEGA</h1>
      <p class="login-sub">Komando Pramuka SMEA 3</p>
    </div>

    <!-- LOGIN USER (tampil di depan) -->
    <div class="login-card" id="card-user">
      <p class="login-card-title">Masuk sebagai Anggota</p>
      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="input-email-user" placeholder="email@example.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="input-pass-user" placeholder="Password kamu">
      </div>
      <div id="login-error-user" class="error-msg" style="display:none"></div>
      <button class="btn-login-user" id="btn-login-user" onclick="doLoginUser()">
        <span id="login-text-user">Masuk</span>
        <span id="login-loading-user" style="display:none">Memuat...</span>
      </button>
    </div>

    <!-- TRIGGER LOGIN ADMIN (tersembunyi, tap logo 5x) -->
    <div id="card-admin" style="display:none">
      <div class="login-card login-card-admin">
        <p class="login-card-title admin-title">Login Admin</p>
        <div class="form-group">
          <label>EMAIL ADMIN</label>
          <input type="email" id="input-email-admin" placeholder="Email admin" autocomplete="off">
        </div>
        <div class="form-group">
          <label>PASSWORD ADMIN</label>
          <input type="password" id="input-pass-admin" placeholder="Password admin">
        </div>
        <div id="login-error-admin" class="error-msg" style="display:none"></div>
        <button class="btn-login-admin" id="btn-login-admin" onclick="doLoginAdmin()">
          <span id="login-text-admin">Masuk sebagai Admin</span>
          <span id="login-loading-admin" style="display:none">Memuat...</span>
        </button>
      </div>
    </div>

    <p class="login-footer" id="login-footer-tap" onclick="tapLogo()">Digital Scout Management System</p>
  </div>
</div>
